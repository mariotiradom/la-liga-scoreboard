<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UCL Scoreboard Live - Broadcast Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Barlow+Semi+Condensed:wght@600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --ucl-blue-icon: #0028ff;
      --ucl-timer-bg: #ffffff;
      --ucl-timer-text: #060e36;
      --ucl-bar-start: #0c0675;
      --ucl-bar-mid: #040342;
      --ucl-bar-end: #0d0782;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: transparent;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    body.control-mode {
      background: #0b0f19;
      color: #ffffff;
      padding-bottom: 50px;
    }

    /* ==========================================
       MARCADOR OFICIAL UCL (ESQUINA SUPERIOR IZQ)
       ========================================== */
    .scoreboard-wrapper {
      position: fixed;
      top: 42px;
      left: 52px;
      display: flex;
      align-items: stretch;
      height: 52px;
      z-index: 1000;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.55));
    }

    @media (max-width: 768px) {
      body.control-mode .scoreboard-wrapper {
        position: relative;
        top: 0;
        left: 0;
        margin: 18px auto 8px auto;
        justify-content: center;
        transform: scale(0.75);
        transform-origin: center top;
      }
    }

    /* BLOQUE IZQUIERDO: LOGO + RELOJ */
    .left-block {
      display: flex;
      align-items: stretch;
      height: 100%;
    }

    .ucl-logo-box {
      width: 50px;
      background: linear-gradient(180deg, #0033ff 0%, #001ae6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ajuste para el logo.png provisto */
    .ucl-logo-img {
      width: 68px;
      height: 68px;
      object-fit: contain;
      transform: translateY(3px);
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
    }

    .ucl-starball-fallback {
      width: 38px;
      height: 38px;
      display: none;
    }

    .timer-box {
      background: var(--ucl-timer-bg);
      min-width: 142px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow Semi Condensed', sans-serif;
      font-size: 38px;
      font-weight: 700;
      color: var(--ucl-timer-text);
      letter-spacing: 1.5px;
      line-height: 1;
      position: relative;
    }

    .added-time-badge {
      position: absolute;
      top: 100%;
      right: 0;
      background: #00e5ff;
      color: #04043c;
      font-family: 'Barlow Semi Condensed', sans-serif;
      font-weight: 800;
      font-size: 20px;
      padding: 2px 10px;
      display: none;
    }

    .added-time-badge.active {
      display: block;
    }

    /* SEPARACIÓN TRANSPARENTE DE 8PX */
    .spacer {
      width: 8px;
      background: transparent;
    }

    /* BLOQUE DERECHO: EQUIPOS, GOLES Y ANIMACIÓN GOAL */
    .right-block {
      display: flex;
      align-items: stretch;
      height: 100%;
      background: linear-gradient(90deg, var(--ucl-bar-start) 0%, var(--ucl-bar-mid) 50%, var(--ucl-bar-end) 100%);
      position: relative;
      overflow: hidden;
    }

    /* Franjas verticales divisibles en 2 colores */
    .team-stripe {
      width: 9px;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    .stripe-half {
      width: 100%;
      height: 50%;
      transition: background-color 0.25s ease;
    }

    .team-code {
      width: 124px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      font-size: 31px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    .score-center {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      position: relative;
    }

    .arc-left, .arc-right {
      width: 14px;
      height: 38px;
      opacity: 0.55;
    }

    .score-num {
      width: 46px;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      font-size: 35px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
    }

    .score-divider {
      width: 2px;
      height: 30px;
      background: rgba(80, 110, 255, 0.4);
      margin: 0 3px;
    }

    /* ====================================================
       CAPAS DE TRANSICIÓN DINÁMICA DE GOL (IZQ -> DER)
       ==================================================== */
    .goal-animation-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }

    /* 1. Cortina bicolor del equipo que barre de izquierda a derecha */
    .goal-color-wipe {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      transform: translateX(-102%);
      z-index: 21;
    }

    .wipe-bar-top, .wipe-bar-bottom {
      width: 100%;
      height: 50%;
    }

    /* 2. Banner azul oficial con texto GOAL itálico y franja del anotador a la derecha */
    .goal-text-stage {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #090496 0%, #0d06b8 50%, #080382 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateX(-102%);
      z-index: 22;
      overflow: hidden;
    }

    .goal-word-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateX(-40px) skewX(-10deg);
      opacity: 0;
    }

    /* Contorno paralelo sutil detrás de GOAL como en la captura */
    .goal-word-outline {
      position: absolute;
      font-family: 'Barlow Condensed', sans-serif;
      font-style: italic;
      font-weight: 900;
      font-size: 62px;
      letter-spacing: 3px;
      color: transparent;
      -webkit-text-stroke: 2px rgba(255, 255, 255, 0.45);
      transform: translate(-4px, 0);
      line-height: 1;
    }

    .goal-word-main {
      position: relative;
      font-family: 'Barlow Condensed', sans-serif;
      font-style: italic;
      font-weight: 900;
      font-size: 62px;
      letter-spacing: 3px;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    }

    /* Franja derecha con los 2 colores del equipo que anotó durante el cartel GOAL */
    .goal-scorer-end-stripe {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 10px;
      display: flex;
      flex-direction: column;
    }

    /* Keyframes de la secuencia completa (3.4 segundos) */
    .goal-animation-layer.active .goal-color-wipe {
      animation: wipeSequence 3.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .goal-animation-layer.active .goal-text-stage {
      animation: stageSequence 3.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .goal-animation-layer.active .goal-word-wrapper {
      animation: wordSequence 3.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* La barra bicolor entra de izq a der, se mantiene de fondo y sale hacia la derecha */
    @keyframes wipeSequence {
      0%   { transform: translateX(-102%); }
      14%  { transform: translateX(0%); }
      86%  { transform: translateX(0%); }
      100% { transform: translateX(102%); }
    }

    /* El contenedor azul GOAL entra de izq a der justo detrás de los 2 colores del club */
    @keyframes stageSequence {
      0%, 20% { transform: translateX(-102%); }
      34%     { transform: translateX(0%); }
      76%     { transform: translateX(0%); }
      92%, 100% { transform: translateX(102%); }
    }

    /* El texto GOAL se desliza con potencia en el centro */
    @keyframes wordSequence {
      0%, 24% { transform: translateX(-50px); opacity: 0; }
      38%     { transform: translateX(0px); opacity: 1; }
      72%     { transform: translateX(6px); opacity: 1; }
      86%, 100% { transform: translateX(60px); opacity: 0; }
    }

    /* ==========================================
       PANEL DE CONTROL (CELULAR Y PC)
       ========================================== */
    .control-panel {
      max-width: 540px;
      margin: 115px auto 20px auto;
      background: #151c2c;
      border: 1px solid #263147;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 768px) {
      .control-panel {
        margin: 0 12px;
        padding: 15px;
      }
    }

    body.overlay-mode .control-panel {
      display: none !important;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #263147;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #00e5ff;
    }

    .status-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      background: #1e293b;
      color: #94a3b8;
    }

    .status-pill.online {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .section-box {
      background: #0f1522;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 10px;
      letter-spacing: 0.8px;
    }

    .teams-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .team-card {
      background: #161f33;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }

    .input-row {
      margin-bottom: 8px;
    }

    .colors-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 10px;
      background: #0b0f19;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #263147;
    }

    .color-pair {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .color-tag {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 700;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      background: #0b0f19;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-weight: 700;
      text-align: center;
      font-size: 15px;
      text-transform: uppercase;
    }

    input[type="color"] {
      width: 30px;
      height: 28px;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0;
    }

    .btn-same-color {
      background: #1e293b;
      color: #94a3b8;
      font-size: 10px;
      padding: 5px 6px;
      border-radius: 5px;
      font-weight: 700;
    }

    .score-btn-group {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 10px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.15s;
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-goal {
      background: #2563eb;
      color: #ffffff;
    }

    .btn-minus {
      background: #334155;
      color: #cbd5e1;
    }

    .btn-test-anim {
      margin-top: 8px;
      width: 100%;
      background: rgba(37, 99, 235, 0.18);
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.3);
      padding: 7px;
      font-size: 11px;
    }

    .btn-start {
      background: #10b981;
      color: #052e16;
    }

    .btn-pause {
      background: #f59e0b;
      color: #451a03;
    }

    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      font-size: 12px;
      padding: 9px 8px;
    }

    .timer-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .timer-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .custom-time-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
  </style>
</head>
<body class="control-mode">

  <!-- ====================================================
       MARCADOR OFICIAL UEFA CHAMPIONS LEAGUE (2024/2025)
       ==================================================== -->
  <div class="scoreboard-wrapper" id="scoreboard">
    <!-- Bloque Izquierdo: Logo.png + Reloj -->
    <div class="left-block">
      <div class="ucl-logo-box">
        <!-- Carga tu archivo logo.png de la carpeta; si no está, muestra el SVG de respaldo -->
        <img src="logo.png" alt="UCL" class="ucl-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <svg class="ucl-starball-fallback" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="44" stroke="white" stroke-width="3" opacity="0.3"/>
          <polygon points="50,9 55,23 70,23 58,32 62,46 50,37 38,46 42,32 30,23 45,23" fill="white"/>
          <polygon points="18,34 25,45 38,43 29,53 33,66 21,59 10,67 14,53 6,43 18,44" fill="white"/>
          <polygon points="82,34 82,44 94,43 86,53 90,67 79,59 67,66 71,53 62,43 75,45" fill="white"/>
          <polygon points="32,88 37,75 27,66 40,66 45,54 50,66 63,66 53,75 58,88 45,80" fill="white"/>
        </svg>
      </div>
      <div class="timer-box">
        <span id="displayTimer">00:00</span>
        <div class="added-time-badge" id="addedBadge">+0</div>
      </div>
    </div>

    <!-- Separación transparente -->
    <div class="spacer"></div>

    <!-- Bloque Derecho: Franja Bicolor Local + Equipos + Goles + Franja Bicolor Visita -->
    <div class="right-block" id="rightBlock">
      
      <!-- Franja Bicolor Local (Ej. BAR: Granate arriba / Azul abajo) -->
      <div class="team-stripe">
        <div class="stripe-half" id="homeStripe1" style="background: #a50044;"></div>
        <div class="stripe-half" id="homeStripe2" style="background: #004d98;"></div>
      </div>

      <div class="team-code" id="displayHomeCode">BAR</div>

      <div class="score-center">
        <!-- Arco curvo izquierdo -->
        <svg class="arc-left" viewBox="0 0 14 38" fill="none">
          <path d="M2 2C11 11 11 27 2 36" stroke="#3d5afe" stroke-width="2.2" stroke-linecap="round"/>
        </svg>

        <div class="score-num" id="displayHomeScore">0</div>
        <div class="score-divider"></div>
        <div class="score-num" id="displayAwayScore">0</div>

        <!-- Arco curvo derecho -->
        <svg class="arc-right" viewBox="0 0 14 38" fill="none">
          <path d="M12 2C3 11 3 27 12 36" stroke="#3d5afe" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="team-code" id="displayAwayCode">AVL</div>

      <!-- Franja Bicolor Visitante (Ej. AVL: Celeste arriba / Vino abajo) -->
      <div class="team-stripe">
        <div class="stripe-half" id="awayStripe1" style="background: #95bfe5;"></div>
        <div class="stripe-half" id="awayStripe2" style="background: #670e36;"></div>
      </div>

      <!-- CAPA DE ANIMACIÓN DINÁMICA DE GOL (IZQUIERDA A DERECHA) -->
      <div class="goal-animation-layer" id="goalAnimLayer">
        <!-- Paso 1: Barrido con los 2 colores del equipo que anota -->
        <div class="goal-color-wipe">
          <div class="wipe-bar-top" id="wipeBarTop"></div>
          <div class="wipe-bar-bottom" id="wipeBarBottom"></div>
        </div>
        <!-- Paso 2: Cartel GOAL oficial con los colores del anotador a la derecha -->
        <div class="goal-text-stage">
          <div class="goal-word-wrapper">
            <span class="goal-word-outline">GOAL</span>
            <span class="goal-word-main">GOAL</span>
          </div>
          <div class="goal-scorer-end-stripe">
            <div class="stripe-half" id="goalEndStripe1"></div>
            <div class="stripe-half" id="goalEndStripe2"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ====================================================
       CONSOLA DE CONTROL REMOTO (CELULAR / NAVEGADOR)
       ==================================================== -->
  <div class="control-panel" id="controlPanel">
    <div class="panel-header">
      <span class="panel-title">Control Champions Live</span>
      <span class="status-pill" id="connStatus">Conectando...</span>
    </div>

    <!-- SECCIÓN GOLES, NOMBRES Y 2 COLORES POR EQUIPO -->
    <div class="section-box">
      <div class="section-label">Equipos, Doble Color y Goles</div>
      <div class="teams-grid">
        
        <!-- Tarjeta Local -->
        <div class="team-card">
          <div class="input-row">
            <input type="text" id="inputHomeCode" maxlength="3" value="BAR" onchange="updateTeams()">
          </div>
          <div class="colors-row">
            <div class="color-pair">
              <span class="color-tag">1</span>
              <input type="color" id="inputHomeColor1" value="#a50044" onchange="updateTeams()" title="Color Superior">
              <span class="color-tag">2</span>
              <input type="color" id="inputHomeColor2" value="#004d98" onchange="updateTeams()" title="Color Inferior">
            </div>
            <button class="btn-same-color" onclick="unifyColor('home')" title="Usar 1 solo color">1 Color</button>
          </div>
          <div class="score-btn-group">
            <button class="btn-minus" onclick="changeScore('home', -1)">-1</button>
            <button class="btn-goal" onclick="changeScore('home', 1)">+1 GOL</button>
          </div>
          <button class="btn-test-anim" onclick="testGoalAnim('home')">✨ Probar Animación Local</button>
        </div>

        <!-- Tarjeta Visitante -->
        <div class="team-card">
          <div class="input-row">
            <input type="text" id="inputAwayCode" maxlength="3" value="AVL" onchange="updateTeams()">
          </div>
          <div class="colors-row">
            <div class="color-pair">
              <span class="color-tag">1</span>
              <input type="color" id="inputAwayColor1" value="#95bfe5" onchange="updateTeams()" title="Color Superior">
              <span class="color-tag">2</span>
              <input type="color" id="inputAwayColor2" value="#670e36" onchange="updateTeams()" title="Color Inferior">
            </div>
            <button class="btn-same-color" onclick="unifyColor('away')" title="Usar 1 solo color">1 Color</button>
          </div>
          <div class="score-btn-group">
            <button class="btn-minus" onclick="changeScore('away', -1)">-1</button>
            <button class="btn-goal" onclick="changeScore('away', 1)">+1 GOL</button>
          </div>
          <button class="btn-test-anim" onclick="testGoalAnim('away')">✨ Probar Animación Visita</button>
        </div>

      </div>
    </div>

    <!-- SECCIÓN CRONÓMETRO -->
    <div class="section-box">
      <div class="section-label">Cronómetro en Vivo (Sincronizado)</div>
      <div class="timer-controls">
        <button class="btn-start" onclick="toggleTimer()">▶ INICIAR</button>
        <button class="btn-pause" onclick="pauseTimer()">⏸ PAUSAR</button>
      </div>
      <div class="timer-presets">
        <button class="btn-secondary" onclick="setExactTime(0, 0)">00:00</button>
        <button class="btn-secondary" onclick="setExactTime(45, 0)">45:00</button>
        <button class="btn-secondary" onclick="setExactTime(90, 0)">90:00</button>
        <button class="btn-secondary" onclick="addMinute(1)">+1 Min</button>
      </div>
      <div class="custom-time-row">
        <input type="number" id="customMin" placeholder="Min (ej. 51)" min="0" max="150">
        <input type="number" id="customSec" placeholder="Seg (0-59)" min="0" max="59">
        <button class="btn-secondary" style="white-space: nowrap;" onclick="applyCustomTime()">Fijar Hora</button>
      </div>
    </div>

    <!-- SECCIÓN TIEMPO AÑADIDO -->
    <div class="section-box" style="margin-bottom: 0;">
      <div class="section-label">Tiempo Añadido (+ Descuento)</div>
      <div class="timer-presets">
        <button class="btn-secondary" onclick="setAddedTime(0)">Ocultar</button>
        <button class="btn-secondary" onclick="setAddedTime(2)">+2'</button>
        <button class="btn-secondary" onclick="setAddedTime(4)">+4'</button>
        <button class="btn-secondary" onclick="setAddedTime(6)">+6'</button>
      </div>
    </div>
  </div>

  <!-- ====================================================
       FIREBASE SDK + LÓGICA DE SINCRONIZACIÓN Y ANIMACIÓN
       ==================================================== -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // 1. DETECTAR MODO OVERLAY PARA OBS (?mode=overlay)
    const params = new URLSearchParams(window.location.search);
    if (params.get('mode') === 'overlay') {
      document.body.classList.remove('control-mode');
      document.body.classList.add('overlay-mode');
    }

    // 2. CONFIGURACIÓN CONECTADA A TU FIREBASE REALTIME DATABASE
    const firebaseConfig = {
      databaseURL: "https://marcardor-ucl-default-rtdb.firebaseio.com",
      projectId: "marcardor-ucl"
    };

    let state = {
      homeCode: "BAR",
      awayCode: "AVL",
      homeColor1: "#a50044",
      homeColor2: "#004d98",
      awayColor1: "#95bfe5",
      awayColor2: "#670e36",
      homeScore: 0,
      awayScore: 0,
      addedTime: 0,
      isRunning: false,
      baseSeconds: 0,
      startedAt: null,
      lastGoalEvent: null // Guarda { team: 'home'|'away', id: timestamp } para disparar la transición
    };

    let lastProcessedGoalId = null;
    let scoreRevealTimeout = null;
    let isFirstLoad = true;

    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('ucl_match_v2');
    const statusEl = document.getElementById('connStatus');

    dbRef.on('value', (snapshot) => {
      const remote = snapshot.val();
      if (remote) {
        const incomingGoal = remote.lastGoalEvent;

        if (isFirstLoad) {
          if (incomingGoal && incomingGoal.id) {
            lastProcessedGoalId = incomingGoal.id;
          }
          state = { ...state, ...remote };
          renderUI(true);
          isFirstLoad = false;
        } else {
          // ¿Se disparó una nueva animación de gol desde el celular o panel?
          if (incomingGoal && incomingGoal.id && incomingGoal.id !== lastProcessedGoalId) {
            lastProcessedGoalId = incomingGoal.id;
            state = { ...state, ...remote };
            playGoalTransition(incomingGoal.team);
          } else {
            state = { ...state, ...remote };
            renderUI(true);
          }
        }
      } else {
        dbRef.set(state);
        isFirstLoad = false;
      }
      statusEl.textContent = "En Vivo (Firebase)";
      statusEl.classList.add('online');
    });

    function pushState() {
      dbRef.set(state);
    }

    // 3. FUNCIONES DE EQUIPOS, COLORES Y GOLES
    function updateTeams() {
      state.homeCode = document.getElementById('inputHomeCode').value.toUpperCase() || "LOC";
      state.awayCode = document.getElementById('inputAwayCode').value.toUpperCase() || "VIS";
      state.homeColor1 = document.getElementById('inputHomeColor1').value;
      state.homeColor2 = document.getElementById('inputHomeColor2').value;
      state.awayColor1 = document.getElementById('inputAwayColor1').value;
      state.awayColor2 = document.getElementById('inputAwayColor2').value;
      renderUI(true);
      pushState();
    }

    function unifyColor(team) {
      if (team === 'home') {
        const c1 = document.getElementById('inputHomeColor1').value;
        document.getElementById('inputHomeColor2').value = c1;
      } else {
        const c1 = document.getElementById('inputAwayColor1').value;
        document.getElementById('inputAwayColor2').value = c1;
      }
      updateTeams();
    }

    function changeScore(team, delta) {
      if (team === 'home') {
        state.homeScore = Math.max(0, state.homeScore + delta);
      } else {
        state.awayScore = Math.max(0, state.awayScore + delta);
      }

      // Si es +1 GOL, enviamos el evento de transición dinámica
      if (delta > 0) {
        state.lastGoalEvent = {
          team: team,
          id: Date.now()
        };
      }
      pushState();
    }

    function testGoalAnim(team) {
      state.lastGoalEvent = {
        team: team,
        id: Date.now()
      };
      pushState();
    }

    // 4. SECUENCIA DE ANIMACIÓN DE GOL (IZQUIERDA A DERECHA)
    function playGoalTransition(scoringTeam) {
      // Actualizar nombres y colores de inmediato, pero retener el cambio del número 900ms
      // hasta que la cortina bicolor haya cubierto el marcador por completo
      renderUI(false);

      const c1 = scoringTeam === 'home' ? state.homeColor1 : state.awayColor1;
      const c2 = scoringTeam === 'home' ? state.homeColor2 : state.awayColor2;

      document.getElementById('wipeBarTop').style.background = c1;
      document.getElementById('wipeBarBottom').style.background = c2;
      document.getElementById('goalEndStripe1').style.background = c1;
      document.getElementById('goalEndStripe2').style.background = c2;

      const animLayer = document.getElementById('goalAnimLayer');
      animLayer.classList.remove('active');
      void animLayer.offsetWidth; // Forzar reflow para reiniciar animación CSS
      animLayer.classList.add('active');

      // Cuando la cortina ya tapó los números (1.1s), actualizamos el dígito detrás del telón
      if (scoreRevealTimeout) clearTimeout(scoreRevealTimeout);
      scoreRevealTimeout = setTimeout(() => {
        document.getElementById('displayHomeScore').textContent = state.homeScore;
        document.getElementById('displayAwayScore').textContent = state.awayScore;
      }, 1100);
    }

    // 5. CRONÓMETRO BASADO EN TIMESTAMPS
    function getCurrentTotalSeconds() {
      if (!state.isRunning || !state.startedAt) {
        return state.baseSeconds;
      }
      const elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
      return state.baseSeconds + Math.max(0, elapsed);
    }

    function toggleTimer() {
      if (!state.isRunning) {
        state.isRunning = true;
        state.startedAt = Date.now();
        pushState();
      }
    }

    function pauseTimer() {
      if (state.isRunning) {
        state.baseSeconds = getCurrentTotalSeconds();
        state.isRunning = false;
        state.startedAt = null;
        pushState();
      }
    }

    function setExactTime(minutes, seconds) {
      state.baseSeconds = (minutes * 60) + seconds;
      if (state.isRunning) {
        state.startedAt = Date.now();
      }
      pushState();
    }

    function addMinute(mins) {
      state.baseSeconds = Math.max(0, getCurrentTotalSeconds() + (mins * 60));
      if (state.isRunning) {
        state.startedAt = Date.now();
      }
      pushState();
    }

    function applyCustomTime() {
      const m = parseInt(document.getElementById('customMin').value) || 0;
      const s = parseInt(document.getElementById('customSec').value) || 0;
      setExactTime(m, s);
    }

    function setAddedTime(mins) {
      state.addedTime = mins;
      pushState();
    }

    // 6. RENDERIZADO VISUAL
    function formatMMSS(totalSeconds) {
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function renderUI(updateScoresImmediately = true) {
      document.getElementById('displayHomeCode').textContent = state.homeCode;
      document.getElementById('displayAwayCode').textContent = state.awayCode;

      document.getElementById('homeStripe1').style.background = state.homeColor1;
      document.getElementById('homeStripe2').style.background = state.homeColor2;
      document.getElementById('awayStripe1').style.background = state.awayColor1;
      document.getElementById('awayStripe2').style.background = state.awayColor2;

      if (updateScoresImmediately) {
        document.getElementById('displayHomeScore').textContent = state.homeScore;
        document.getElementById('displayAwayScore').textContent = state.awayScore;
      }

      if (document.activeElement.id !== 'inputHomeCode') {
        document.getElementById('inputHomeCode').value = state.homeCode;
      }
      if (document.activeElement.id !== 'inputAwayCode') {
        document.getElementById('inputAwayCode').value = state.awayCode;
      }

      document.getElementById('inputHomeColor1').value = state.homeColor1;
      document.getElementById('inputHomeColor2').value = state.homeColor2;
      document.getElementById('inputAwayColor1').value = state.awayColor1;
      document.getElementById('inputAwayColor2').value = state.awayColor2;

      const badge = document.getElementById('addedBadge');
      if (state.addedTime > 0) {
        badge.textContent = '+' + state.addedTime;
        badge.classList.add('active');
      } else {
        badge.classList.remove('active');
      }

      document.getElementById('displayTimer').textContent = formatMMSS(getCurrentTotalSeconds());
    }

    setInterval(() => {
      document.getElementById('displayTimer').textContent = formatMMSS(getCurrentTotalSeconds());
    }, 250);

    renderUI(true);
  </script>
</body>
</html>
